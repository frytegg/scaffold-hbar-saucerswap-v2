name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint both packages with zero warnings allowed
        run: yarn lint:strict

      - name: Type-check both packages
        run: yarn typecheck

      - name: Offline unit tests of packages/nextjs, no network and no key
        run: yarn test:unit

      - name: Offline mock tier of packages/hardhat, no network and no key
        run: yarn test:mock

      - name: Formatting, types and tests of tools/checks and tools/gate
        run: yarn check:tools

      - name: Tests and types of the route probe
        run: yarn probe:routes:check

      # ShellCheck comes with the ubuntu runner image.
      - name: ShellCheck on the gate scripts
        run: shellcheck tools/gate/*.sh
