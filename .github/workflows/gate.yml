name: Gate

# Gate of the template repository. The published CLI scaffolds a fresh project from this checkout through its
# local-template seam (which also works while the repository is private), then the project is checked the way
# a judge would check it: strict lint, types, production build, boot with no env file, every route requested.
# No secret is used anywhere. tools/gate/README.md describes each step.

on:
  # A leg scaffolds, installs, builds and probes in a browser, and a private repository's Actions minutes are
  # limited: pushes run on main only, and not when they change Markdown alone, which check:all checks before a
  # commit and the nightly run checks again. Another branch runs by hand (workflow_dispatch).
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  schedule:
    # Nightly, away from 17:00-18:00 UTC. Scheduled runs only fire on the default branch.
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scaffold:
    # Inert in scaffolded projects and in forks. The public skeleton runs gate-skeleton.yml instead.
    if: github.repository_owner == 'frytegg' && github.repository != 'frytegg/hbar-template-gate-skeleton'
    name: node ${{ matrix.node }}, package manager ${{ matrix.pm }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # One leg per push. Nightly and manual runs add the current LTS and the second package manager.
        # "default" passes no package-manager flag, so the CLI's own default applies.
        node: ${{ fromJSON(github.event_name == 'push' && '["20.18.3"]' || '["20.18.3", "lts/*"]') }}
        pm: ${{ fromJSON(github.event_name == 'push' && '["default"]' || '["default", "npm"]') }}
    steps:
      - name: Checkout with full history (the secret scan reads every commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Tests of the gate tooling
        run: node --test tools/gate/routes.test.mjs

      # CI stays as Actions sets it (true): installs are then immutable, which is what a CI-based judge gets.
      # The root "test" script forks a public testnet endpoint, a third party: it is reported, never blocking.
      - name: Scaffold from this checkout and check the project
        run: >
          bash tools/gate/scaffold-and-check.sh
          --template-dir "$GITHUB_WORKSPACE"
          --work-dir "$RUNNER_TEMP/gate"
          --solidity-framework hardhat
          --soft test
          --keep
          ${{ matrix.pm == 'npm' && '--package-manager npm' || '' }}

      # probe:routes downloads Chromium only; browsers:ci also installs the system libraries Chromium needs, which the
      # runner image is not guaranteed to have.
      - name: Chromium and its system libraries for the route probe
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/gate/gateapp
        run: npm ci --omit=dev --prefix tools/route-probe && npm run browsers:ci --prefix tools/route-probe

      # The two steps below run root scripts of the scaffolded project. A script that does not exist fails the step.
      - name: Route console probe
        if: ${{ !cancelled() }}
        run: bash tools/gate/run-root-script.sh "$RUNNER_TEMP/gate/gateapp" probe:routes

      - name: Docs checks
        if: ${{ !cancelled() }}
        run: bash tools/gate/run-root-script.sh "$RUNNER_TEMP/gate/gateapp" check:docs

      # Keyless reads of Hedera testnet: hashio, the mirror node and SaucerSwap's contracts are third parties. Nightly
      # and manual runs only; the outcome goes to the job summary and never fails the run.
      - name: Live keyless tier, reported and not blocking
        if: ${{ !cancelled() && github.event_name != 'push' }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/gate/logs"
          log="$RUNNER_TEMP/gate/logs/live-tier.log"
          status=0
          bash tools/gate/run-root-script.sh "$RUNNER_TEMP/gate/gateapp" check:live > "$log" 2>&1 || status=$?
          cat "$log"
          {
            echo "### Live keyless tier: exit $status (third parties, not blocking)"
            echo
            echo '```text'
            tail -n 40 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Secret scan, tree and history
        if: ${{ !cancelled() }}
        run: bash tools/gate/secret-scan.sh

      - name: Upload the step logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/gate/logs
          if-no-files-found: warn

  npm-types:
    # An npm-mode scaffold installs without a lockfile and hoists what it resolves to the project root, so its
    # dependency tree is not the one the matrix leg above checks: a type that holds in the default project can fail
    # there, and no push would say so until the nightly run. This leg scaffolds and type-checks, and stops there:
    # about four minutes, where the same leg with the build, the probe, the docs checks and the secret scan took
    # 5 min 49 s in run 35761386891. The install is most of a leg, so widening the root scripts here is cheap.
    if: github.event_name == 'push' && github.repository_owner == 'frytegg' && github.repository != 'frytegg/hbar-template-gate-skeleton'
    name: npm-mode types, node 20.18.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3

      - name: Scaffold in npm-mode from this checkout and type-check the project
        run: >
          bash tools/gate/scaffold-and-check.sh
          --template-dir "$GITHUB_WORKSPACE"
          --work-dir "$RUNNER_TEMP/gate-npm"
          --solidity-framework hardhat
          --package-manager "npm" --root-scripts typecheck

      - name: Upload the step logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-npm-types
          path: ${{ runner.temp }}/gate-npm/logs
          if-no-files-found: warn
